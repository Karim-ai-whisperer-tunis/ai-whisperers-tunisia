<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Whisperers - Tunis Chapter</title>
    <style>
        /* Base Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Tech Grid & Neon Orbs Background */
        .bg-layer {
            position: absolute; inset: 0; z-index: 0; pointer-events: none;
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        }
        .orb-1 {
            position: absolute; top: -10%; left: -10%; width: 500px; h: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
        }
        .orb-2 {
            position: absolute; top: 40%; right: -10%; width: 500px; h: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
        }

        /* Navbar */
        header {
            border-bottom: 1px solid #1e293b;
            background-color: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 50;
        }
        .nav-container {
            max-width: 1100px; margin: 0 auto; px: 24px; h: 70px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
        }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-icon { background: linear-gradient(135deg, #2563eb, #4f46e5); padding: 8px; border-radius: 10px; font-size: 18px; }
        .logo-text { font-weight: 800; font-size: 18px; }
        .logo-sub { font-size: 11px; color: #3b82f6; text-transform: uppercase; font-weight: 600; display: block; }
        .tag { font-size: 12px; background: #0f172a; border: 1px solid #1e293b; color: #94a3b8; padding: 6px 12px; border-radius: 20px; }

        /* Main Section */
        main { max-width: 800px; margin: 0 auto; padding: 80px 24px; text-center; text-align: center; position: relative; z-index: 10; }
        h1 { font-size: 42px; font-weight: 900; letter-spacing: -1px; margin-bottom: 24px; line-height: 1.2; color: #ffffff; }
        p { font-size: 16px; color: #94a3b8; max-width: 600px; margin: 0 auto 40px auto; line-height: 1.6; }
        
        /* Interactive Button */
        .cta-btn {
            display: inline-block; background-color: #2563eb; color: white; font-weight: 600;
            padding: 14px 28px; border-radius: 12px; text-decoration: none; transition: 0.2s;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
        }
        .cta-btn:hover { background-color: #1d4ed8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="bg-layer"><div class="orb-1"></div><div class="orb-2"></div></div>
    
    <header>
        <div class="nav-container">
            <div class="logo-box">
                <div class="logo-icon">🔮</div>
                <div>
                    <span class="logo-text">AI Whisperers</span>
                    <span class="logo-sub">Tunis Chapter</span>
                </div>
            </div>
            <div class="tag">Stewart Alsop III Community</div>
        </div>
    </header>

    <main>
        <h1>Architecting the Future of AI in Tunisia</h1>
        <p>Where local enterprise professionals, ambitious students, and tech creators converge to master the art of AI orchestration, workflow automation, and cognitive architecture.</p>
        <a href="https://github.com" class="cta-btn" onclick="alert('Welcome! We are customizing the registration portal with Stewart right now.')">Join the Community</a>
    </main>
</body>
</html>
