<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Whisperers - Tunis Chapter</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }
        .neon-glow-1 { background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%); }
        .neon-glow-2 { background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased bg-grid relative min-h-screen overflow-x-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] neon-glow-1 pointer-events-none z-0"></div>
    <div class="absolute top-[40%] right-[-10%] w-[600px] h-[600px] neon-glow-2 pointer-events-none z-0"></div>
    <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-xl text-xl shadow-lg shadow-blue-500/10">🔮</div>
                <div>
                    <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">AI Whisperers</span>
                    <span class="text-xs block font-semibold text-blue-500 uppercase tracking-wider">Tunis Chapter</span>
                </div>
            </div>
            <span class="text-xs font-medium px-3 py-1.5 bg-slate-900 border border-slate-800 text-slate-400 rounded-full">Stewart Alsop III Community</span>
        </div>
    </header>
    <section class="max-w-4xl mx-auto px-6 pt-24 pb-16 text-center relative z-10">
        <h1 class="text-5xl md:text-7xl font-black tracking-tight mb-8 leading-[1.15] bg-gradient-to-b from-white via-white to-slate-500 bg-clip-text text-transparent">
            Architecting the Future <br class="hidden md:inline">of AI in Tunisia
        </h1>
        <p class="text-base md:text-xl text-slate-400 max-w-2xl mx-auto mb-12 leading-relaxed">
            Where local enterprise professionals, ambitious students, and tech creators converge to master the art of AI orchestration, workflow automation, and cognitive architecture.
        </p>
    </section>
</body>
</html>
