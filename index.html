<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Whisperers - Tunis Chapter</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        .bg-grid {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }
        .neon-orb-1 { background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%); }
        .neon-orb-2 { background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased bg-grid relative min-h-screen overflow-x-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] neon-orb-1 pointer-events-none z-0"></div>
    <div class="absolute top-[40%] right-[-10%] w-[600px] h-[600px] neon-orb-2 pointer-events-none z-0"></div>
    
    <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-xl">🔮</div>
                <div>
                    <span class="font-extrabold text-lg">AI Whisperers</span>
                    <span class="text-xs block font-semibold text-blue-500 uppercase">Tunis Chapter</span>
                </div>
            </div>
        </div>
    </header>

    <section class="max-w-4xl mx-auto px-6 pt-28 pb-20 text-center relative z-10">
        <h1 class="text-5xl md:text-7xl font-black tracking-tight mb-8">Architecting the Future of AI in Tunisia</h1>
        <p class="text-base md:text-lg text-slate-400 max-w-2xl mx-auto mb-12">Where enterprise professionals, students, and tech creators converge to master AI orchestration.</p>
        <a href="#join" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl">Join the Community</a>
    </section>
</body>
</html>
